<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 444" width="660" height="444" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>
  svg .name { font-size: 11px; font-weight: 600; fill: #1f2328; }
  svg .sub  { font-size: 8.5px; fill: #57606a; }
  svg .chip { font-size: 10px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
  svg .note { font-size: 9px; fill: #57606a; }
  svg .arrow { stroke: #6e7781; stroke-width: 1.2; }
  svg .head { font-size: 13px; font-weight: 700; fill: #1f2328; }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
          orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
  </marker>
</defs>
<text x="12" y="18" class="head">The CausalEEGNet training pipeline: steps 1 to 7 make one run</text>
<rect x="12" y="34" width="310" height="46" rx="7" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1.3"/><text x="22" y="52" class="name">14 stimulation-off sessions</text><text x="22" y="67" class="sub">560 trials, z-scored 1 kHz LFP · (560, 35, 2000)</text>
<rect x="12" y="96" width="310" height="46" rx="7" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1.3"/><text x="22" y="114" class="name">one trial = 40 bins</text><text x="22" y="129" class="sub">velocity targets + missing-kinematics mask · (40, 2)</text>
<line x1="26" y1="82" x2="26" y2="93" class="arrow" marker-end="url(#head)"/>
<rect x="12" y="158" width="310" height="46" rx="7" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.3"/><text x="22" y="176" class="name">epoch start: new permutation of 560</text><text x="22" y="191" class="sub">default_rng(seed).permutation(560)</text>
<line x1="26" y1="144" x2="26" y2="155" class="arrow" marker-end="url(#head)"/>
<rect x="12" y="220" width="310" height="46" rx="7" fill="#fff4e0" stroke="#c77c02" stroke-width="1.3"/><text x="22" y="238" class="name">35 batches of 16 trials</text><text x="22" y="253" class="sub">slices of the permutation, not of the file · (16, 35, 2000)</text>
<line x1="26" y1="206" x2="26" y2="217" class="arrow" marker-end="url(#head)"/>
<rect x="338" y="34" width="310" height="46" rx="7" fill="#fff4e0" stroke="#c77c02" stroke-width="1.3"/><text x="348" y="52" class="name">forward, backward, update</text><text x="348" y="67" class="sub">Muon on matrices, Adam on vectors · 35 steps/epoch</text>
<path d="M 26 268 V 270 H 656 V 25" class="arrow" fill="none"/>
<line x1="656" y1="25" x2="656" y2="34" class="arrow" marker-end="url(#head)"/>
<rect x="338" y="96" width="310" height="46" rx="7" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1.3"/><text x="348" y="114" class="name">score 150 held-out trials</text><text x="348" y="129" class="sub">fixed order, R2 = mean(R2_vx, R2_vy) on valid bins</text>
<line x1="352" y1="82" x2="352" y2="93" class="arrow" marker-end="url(#head)"/>
<rect x="338" y="158" width="310" height="46" rx="7" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1.3"/><text x="348" y="176" class="name">keep best epoch</text><text x="348" y="191" class="sub">stop after 20 epochs without improvement</text>
<line x1="352" y1="144" x2="352" y2="155" class="arrow" marker-end="url(#head)"/>
<text x="12" y="320" class="note">steps 1 and 2 are fixed; steps 3 to 7 repeat once per seed, five runs in total. The ensemble is the mean of the five predictions, not the mean of five scores.</text>
<rect x="12" y="330" width="62" height="24" rx="12" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/><text x="43" y="346" class="chip">seed 0</text>
<rect x="82" y="330" width="62" height="24" rx="12" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/><text x="113" y="346" class="chip">seed 1</text>
<rect x="152" y="330" width="62" height="24" rx="12" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/><text x="183" y="346" class="chip">seed 2</text>
<rect x="222" y="330" width="62" height="24" rx="12" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/><text x="253" y="346" class="chip">seed 3</text>
<rect x="292" y="330" width="62" height="24" rx="12" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/><text x="323" y="346" class="chip">seed 4</text>
<path d="M 43 358 H 323" class="arrow" fill="none"/>
<line x1="330.0" y1="358" x2="330.0" y2="368" class="arrow" marker-end="url(#head)"/>
<rect x="12.0" y="372" width="205.33333333333334" height="46" rx="7" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.3"/><text x="22.0" y="390" class="name">checkpoint</text><text x="22.0" y="405" class="sub">task4_2_eegnet_seedN.pt</text>
<rect x="227.33333333333334" y="372" width="205.33333333333334" height="46" rx="7" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.3"/><text x="237.33333333333334" y="390" class="name">training log</text><text x="237.33333333333334" y="405" class="sub">eegnet_seedN.json, R2 per epoch</text>
<rect x="442.6666666666667" y="372" width="205.33333333333334" height="46" rx="7" fill="#ffe9e9" stroke="#c62828" stroke-width="1.3"/><text x="452.6666666666667" y="390" class="name">70 score rows</text><text x="452.6666666666667" y="405" class="sub">14 sessions x 5 runs, both inputs</text>
<text x="12" y="432" class="note">R2 = (R2_vx + R2_vy) / 2. Tones: a random-phase 3 or 20 Hz sine added to clean training trials (Appendix B); targets unchanged.</text>
</svg>