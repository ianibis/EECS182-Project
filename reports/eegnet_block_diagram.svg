<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 494" width="686" height="494" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>
  svg .name { font-size: 10.5px; font-weight: 600; fill: #1f2328; }
  svg .shape { font-size: 9px; fill: #8b949e;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  svg .sub  { font-size: 9px; fill: #57606a; }
  svg .head { font-size: 12.5px; font-weight: 700; fill: #1f2328; }
  svg .note { font-size: 8.5px; fill: #57606a; }
  svg .opd  { font-size: 8.5px; fill: #57606a; }
  svg .arrow { stroke: #6e7781; stroke-width: 1.15; }
  svg .var  { font-size: 8.5px; fill: #1f2328;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5"
          orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
  </marker>
</defs>
<text x="12" y="14" class="head">CausalEEGNet: one forward pass</text>
<text x="12" y="27" class="note">two columns, left to right; sheets are the B samples of one batch, sized to the C x T extent of that stage</text>
<rect x="20.0" y="34.0" width="62.0" height="58.0" rx="2" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1" opacity="0.74"/>
<rect x="16.0" y="37.0" width="62.0" height="58.0" rx="2" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1" opacity="0.52"/>
<rect x="12" y="40" width="62.0" height="58.0" rx="2" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1.3"/>
<text x="92.0" y="61.0" class="name">input</text>
<text x="131.5" y="61.0" class="shape">(B, C, T)</text>
<text x="92.0" y="75.0" class="sub">LFP at 1 kHz</text>
<rect x="20.0" y="104.0" width="62.0" height="58.0" rx="2" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1" opacity="0.74"/>
<rect x="16.0" y="107.0" width="62.0" height="58.0" rx="2" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1" opacity="0.52"/>
<rect x="12" y="110.0" width="62.0" height="58.0" rx="2" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1.3"/>
<text x="92.0" y="131.0" class="name">temporal conv</text>
<text x="181.9" y="131.0" class="shape">(B, F, C, T)</text>
<text x="92.0" y="145.0" class="sub">8 filters, kernel 1 x 500, causal</text>
<line x1="15" y1="100.0" x2="15" y2="107.0" class="arrow" marker-end="url(#head)"/>
<rect x="20.0" y="174.0" width="62.0" height="58.0" rx="2" fill="#fff4e0" stroke="#c77c02" stroke-width="1" opacity="0.74"/>
<rect x="16.0" y="177.0" width="62.0" height="58.0" rx="2" fill="#fff4e0" stroke="#c77c02" stroke-width="1" opacity="0.52"/>
<rect x="12" y="180.0" width="62.0" height="58.0" rx="2" fill="#fff4e0" stroke="#c77c02" stroke-width="1.3"/>
<text x="92.0" y="201.0" class="name">batch norm</text>
<text x="163.0" y="201.0" class="shape">(B, F, C, T)</text>
<text x="92.0" y="215.0" class="sub">8 channels</text>
<line x1="15" y1="170.0" x2="15" y2="177.0" class="arrow" marker-end="url(#head)"/>
<rect x="20.0" y="244.0" width="62.0" height="10.0" rx="2" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1" opacity="0.74"/>
<rect x="16.0" y="247.0" width="62.0" height="10.0" rx="2" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1" opacity="0.52"/>
<rect x="12" y="250.0" width="62.0" height="10.0" rx="2" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1.3"/>
<text x="92.0" y="262.0" class="name">spatial conv</text>
<text x="175.6" y="262.0" class="shape">(B, FD, 1, T)</text>
<text x="92.0" y="276.0" class="sub">depthwise 35 x 1, L2 renormalised</text>
<line x1="15" y1="240.0" x2="15" y2="247.0" class="arrow" marker-end="url(#head)"/>
<rect x="20.0" y="296.0" width="62.0" height="10.0" rx="2" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1" opacity="0.74"/>
<rect x="16.0" y="299.0" width="62.0" height="10.0" rx="2" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1" opacity="0.52"/>
<rect x="12" y="302.0" width="62.0" height="10.0" rx="2" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1.3"/>
<text x="92.0" y="314.0" class="name">batch norm + ELU</text>
<text x="200.8" y="314.0" class="shape">(B, FD, 1, T)</text>
<text x="92.0" y="328.0" class="sub">16 maps</text>
<line x1="15" y1="292.0" x2="15" y2="299.0" class="arrow" marker-end="url(#head)"/>
<rect x="20.0" y="348.0" width="56.3" height="10.0" rx="2" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1" opacity="0.74"/>
<rect x="16.0" y="351.0" width="56.3" height="10.0" rx="2" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1" opacity="0.52"/>
<rect x="12" y="354.0" width="56.3" height="10.0" rx="2" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.3"/>
<text x="92.0" y="366.0" class="name">pool + dropout</text>
<text x="188.2" y="366.0" class="shape">(B, FD, 1, T/2)</text>
<text x="92.0" y="380.0" class="sub">1 x 2 pool, p = 0.25</text>
<line x1="15" y1="344.0" x2="15" y2="351.0" class="arrow" marker-end="url(#head)"/>
<rect x="360.0" y="34.0" width="56.3" height="10.0" rx="2" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1" opacity="0.74"/>
<rect x="356.0" y="37.0" width="56.3" height="10.0" rx="2" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1" opacity="0.52"/>
<rect x="352" y="40" width="56.3" height="10.0" rx="2" fill="#f3f7ff" stroke="#2f6fdb" stroke-width="1.3"/>
<text x="432.0" y="52.0" class="name">separable conv</text>
<text x="528.2" y="52.0" class="shape">(B, FD, 1, T/2)</text>
<text x="432.0" y="66.0" class="sub">1 x 62 depthwise + 1 x 1 pointwise</text>
<rect x="360.0" y="86.0" width="56.3" height="10.0" rx="2" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1" opacity="0.74"/>
<rect x="356.0" y="89.0" width="56.3" height="10.0" rx="2" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1" opacity="0.52"/>
<rect x="352" y="92.0" width="56.3" height="10.0" rx="2" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1.3"/>
<text x="432.0" y="104.0" class="name">batch norm + ELU</text>
<text x="540.8" y="104.0" class="shape">(B, FD, 1, T/2)</text>
<text x="432.0" y="118.0" class="sub">16 maps</text>
<line x1="355" y1="82.0" x2="355" y2="89.0" class="arrow" marker-end="url(#head)"/>
<rect x="360.0" y="138.0" width="30.1" height="10.0" rx="2" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1" opacity="0.74"/>
<rect x="356.0" y="141.0" width="30.1" height="10.0" rx="2" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1" opacity="0.52"/>
<rect x="352" y="144.0" width="30.1" height="10.0" rx="2" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.3"/>
<text x="432.0" y="156.0" class="name">pool + dropout</text>
<text x="528.2" y="156.0" class="shape">(B, FD, 1, N)</text>
<text x="432.0" y="170.0" class="sub">1 x 25 to 40 bins, p = 0.25</text>
<line x1="355" y1="134.0" x2="355" y2="141.0" class="arrow" marker-end="url(#head)"/>
<rect x="360.0" y="190.0" width="30.1" height="11.3" rx="2" fill="#ffe9e9" stroke="#c62828" stroke-width="1" opacity="0.74"/>
<rect x="356.0" y="193.0" width="30.1" height="11.3" rx="2" fill="#ffe9e9" stroke="#c62828" stroke-width="1" opacity="0.52"/>
<rect x="352" y="196.0" width="30.1" height="11.3" rx="2" fill="#ffe9e9" stroke="#c62828" stroke-width="1.3"/>
<text x="432.0" y="208.0" class="name">regression head</text>
<text x="534.5" y="208.0" class="shape">(B, N, 2)</text>
<text x="432.0" y="222.0" class="sub">1 x 1 conv, 16 to 2</text>
<line x1="355" y1="186.0" x2="355" y2="193.0" class="arrow" marker-end="url(#head)"/>
<rect x="360.0" y="242.0" width="30.1" height="11.3" rx="2" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1" opacity="0.74"/>
<rect x="356.0" y="245.0" width="30.1" height="11.3" rx="2" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1" opacity="0.52"/>
<rect x="352" y="248.0" width="30.1" height="11.3" rx="2" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1.3"/>
<text x="432.0" y="260.0" class="name">output</text>
<text x="477.8" y="260.0" class="shape">(B, N, 2)</text>
<text x="432.0" y="274.0" class="sub">vx, vy per 50 ms bin</text>
<line x1="355" y1="238.0" x2="355" y2="245.0" class="arrow" marker-end="url(#head)"/>
<path d="M 15 396.0 V 402.0 H 355.0 V 29.0" class="arrow" fill="none"/>
<line x1="355.0" y1="29.0" x2="355.0" y2="37.0" class="arrow" marker-end="url(#head)"/>
<line x1="12" y1="416.0" x2="674" y2="416.0" stroke="#eaeef2" stroke-width="1"/>
<text x="12" y="430.0" class="opd" font-weight="600">temporal conv:</text>
<text x="98" y="430.0" class="opd">Conv1d, kernel 1 x 500: filters the time course, reading all C channels at once.</text>
<text x="12" y="442.0" class="opd" font-weight="600">spatial conv:</text>
<text x="98" y="442.0" class="opd">depthwise 35 x 1: each map is a length-35 electrode mix, weights renormalised to L2 norm 1</text>
<text x="98" y="454.0" class="opd">so only the filter's direction is learned, never its scale (16 maps).</text>
<text x="12" y="466.0" class="opd" font-weight="600">left pad:</text>
<text x="98" y="466.0" class="opd">ConstantPad2d adds 499 zeros early-side only: bin t sees samples &lt;= t, stays causal.</text>
<text x="12" y="484.0" class="var">B batch     C 35 channels     T 2000 samples     N 40 bins     F 8     D 2     K1 500     K2 62     p 0.25</text>
</svg>