<text x="12" y="404.0" class="var">B batch     C 35 channels     T 2000 samples     N 40 bins     V 2     F1 8     D 2     F2 16     K1 500     K2 62     P 2     Q 25     p 0.25</text>
<text x="12" y="418.0" class="note">normalization: fixed input z-score, then BatchNorm2d after each conv; pooling is average</text>
<text x="12" y="431.0" class="note">optimizer: Muon on weight matrices + Adam on biases and BatchNorm affine parameters</text>
<text x="12" y="444.0" class="note">all convolutions are causal (left-only zero padding)</text>
