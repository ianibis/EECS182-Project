<text x="504.0" y="312.0" class="eq" xml:space="preserve" text-anchor="start"><tspan dy="0.0">n</tspan><tspan dy="2.8" font-size="6.4">b</tspan><tspan dy="-2.8"> = tanh(W</tspan><tspan dy="2.8" font-size="6.4">n</tspan><tspan dy="-2.8"> x</tspan><tspan dy="2.8" font-size="6.4">b</tspan><tspan dy="-2.8"> + U</tspan><tspan dy="2.8" font-size="6.4">n</tspan><tspan dy="-2.8">(r</tspan><tspan dy="2.8" font-size="6.4">b</tspan><tspan dy="-2.8"> ⊙ h</tspan><tspan dy="2.8" font-size="6.4">b−1</tspan><tspan dy="-2.8">) + b</tspan><tspan dy="2.8" font-size="6.4">n</tspan><tspan dy="-2.8">)</tspan></text>
