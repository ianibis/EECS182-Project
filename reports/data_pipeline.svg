<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" width="760" height="780" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>
  svg .name { font-size: 12px; font-weight: 600; fill: #1f2328; }
  svg .lane { font-size: 11.5px; font-weight: 700; fill: #1f2328; }
  svg .sub  { font-size: 10.5px; fill: #57606a; font-family: ui-monospace, Menlo, monospace; }
  svg .note { font-size: 8.8px; fill: #57606a; }
  svg .var  { font-size: 9.8px; fill: #1f2328; font-family: ui-monospace, Menlo, monospace; }
  svg .head { font-size: 16px; font-weight: 700; fill: #1f2328; }
  svg .arrow { stroke: #6e7781; stroke-width: 1.1; }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5"
          orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
  </marker>
</defs>
<text x="15" y="20" class="head">Task 4 data pipeline</text>
<text x="15" y="36" class="note">storage &#8594; parse &#8594; split/batch; all counts read from the code and splits.json</text>
<rect x="15" y="50" width="240" height="24" rx="5" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1"/>
<text x="22" y="67" class="lane">1. Storage</text>
<rect x="270" y="50" width="240" height="24" rx="5" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1"/>
<text x="277" y="67" class="lane">2. Parse and tensors</text>
<rect x="525" y="50" width="220" height="24" rx="5" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1"/>
<text x="532" y="67" class="lane">3. Split and batch</text>
<rect x="15" y="88" width="240" height="64" rx="6" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1.1"/>
<text x="23" y="105" class="name">manifest.csv</text>
<text x="23" y="121" class="sub">70 sessions x 61 cols</text>
<text x="23" y="135" class="sub">date, stim, AM, n_include</text>
<line x1="29" y1="153" x2="29" y2="160" class="arrow" marker-end="url(#head)"/>
<rect x="15" y="162" width="240" height="64" rx="6" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1.1"/>
<text x="23" y="179" class="name">splits.json</text>
<text x="23" y="195" class="sub">18/3/5 days</text>
<text x="23" y="209" class="sub">calibration, off_reference</text>
<line x1="29" y1="227" x2="29" y2="234" class="arrow" marker-end="url(#head)"/>
<rect x="15" y="236" width="240" height="64" rx="6" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1.1"/>
<text x="23" y="253" class="name">&lt;session&gt;.h5</text>
<text x="23" y="269" class="sub">/lfp (64, N_s)</text>
<text x="23" y="283" class="sub">/t, masks, /stim, /task</text>
<line x1="29" y1="301" x2="29" y2="308" class="arrow" marker-end="url(#head)"/>
<rect x="15" y="310" width="240" height="64" rx="6" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1.1"/>
<text x="23" y="327" class="name">trials.csv</text>
<text x="23" y="343" class="sub">50 included trials</text>
<text x="23" y="357" class="sub">block 1-5, t_go, t_reward</text>
<line x1="29" y1="375" x2="29" y2="382" class="arrow" marker-end="url(#head)"/>
<rect x="15" y="384" width="240" height="64" rx="6" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1.1"/>
<text x="23" y="401" class="name">kinematics</text>
<text x="23" y="417" class="sub">one row / 50 ms bin</text>
<text x="23" y="431" class="sub">Index_vx_cm, Index_vy_cm</text>
<line x1="29" y1="449" x2="29" y2="456" class="arrow" marker-end="url(#head)"/>
<rect x="15" y="458" width="240" height="64" rx="6" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1.1"/>
<text x="23" y="475" class="name">features/&lt;variant&gt;.h5</text>
<text x="23" y="491" class="sub">lmp (C,B_s), logpow (C,7,B_s)</text>
<text x="23" y="505" class="sub">LMP + 7 bands</text>
<line x1="29" y1="523" x2="29" y2="530" class="arrow" marker-end="url(#head)"/>
<rect x="15" y="532" width="240" height="64" rx="6" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1.1"/>
<text x="23" y="549" class="name">parrm_h5</text>
<text x="23" y="565" class="sub">/lfp, /artifact</text>
<text x="23" y="579" class="sub">optional cleaned ON</text>
<line x1="257" y1="106" x2="267" y2="106" class="arrow" marker-end="url(#head)"/>
<rect x="270" y="88" width="240" height="64" rx="6" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1.1"/>
<text x="278" y="105" class="name">load_session</text>
<text x="278" y="121" class="sub">lfp (C=35, N_s)</text>
<text x="278" y="135" class="sub">64 recorded -&gt; 35 kept</text>
<line x1="284" y1="153" x2="284" y2="160" class="arrow" marker-end="url(#head)"/>
<rect x="270" y="162" width="240" height="64" rx="6" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1.1"/>
<text x="278" y="179" class="name">normalize</text>
<text x="278" y="195" class="sub">robust z per channel</text>
<text x="278" y="209" class="sub">first go -1 s to last reward +1 s</text>
<line x1="284" y1="227" x2="284" y2="234" class="arrow" marker-end="url(#head)"/>
<rect x="270" y="236" width="240" height="64" rx="6" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1.1"/>
<text x="278" y="253" class="name">load_kinematics</text>
<text x="278" y="269" class="sub">pixel -&gt; cm affine</text>
<text x="278" y="283" class="sub">Index_vx_cm, Index_vy_cm</text>
<line x1="284" y1="301" x2="284" y2="308" class="arrow" marker-end="url(#head)"/>
<rect x="270" y="310" width="240" height="64" rx="6" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1.1"/>
<text x="278" y="327" class="name">load_lfp_dataset</text>
<text x="278" y="343" class="sub">(N_trials, 35, 2000)</text>
<text x="278" y="357" class="sub">targets (N_trials, 40, 2) + mask</text>
<line x1="284" y1="375" x2="284" y2="382" class="arrow" marker-end="url(#head)"/>
<rect x="270" y="384" width="240" height="64" rx="6" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1.1"/>
<text x="278" y="401" class="name">trial_arrays(L=9)</text>
<text x="278" y="417" class="sub">(N_trials, 40, 2800)</text>
<text x="278" y="431" class="sub">10 lags x 35 ch x 8 feats</text>
<line x1="284" y1="449" x2="284" y2="456" class="arrow" marker-end="url(#head)"/>
<rect x="270" y="458" width="240" height="64" rx="6" fill="#e7f6e9" stroke="#2e7d32" stroke-width="1.1"/>
<text x="278" y="475" class="name">windows_from_valid</text>
<text x="278" y="491" class="sub">(N_valid, 2800)</text>
<text x="278" y="505" class="sub">drop NaN bins</text>
<line x1="512" y1="106" x2="522" y2="106" class="arrow" marker-end="url(#head)"/>
<rect x="525" y="88" width="220" height="64" rx="6" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/>
<text x="533" y="105" class="name">Day split</text>
<text x="533" y="121" class="sub">18/3/5 days</text>
<text x="533" y="135" class="sub">42/9/19 sessions</text>
<line x1="539" y1="153" x2="539" y2="160" class="arrow" marker-end="url(#head)"/>
<rect x="525" y="162" width="220" height="64" rx="6" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/>
<text x="533" y="179" class="name">Test set</text>
<text x="533" y="195" class="sub">14 ON + 5 OFF</text>
<text x="533" y="209" class="sub">1,3,3,3,4 ON/day; 5 OFF refs</text>
<line x1="539" y1="227" x2="539" y2="234" class="arrow" marker-end="url(#head)"/>
<rect x="525" y="236" width="220" height="64" rx="6" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/>
<text x="533" y="253" class="name">Calibration</text>
<text x="533" y="269" class="sub">pool 20 (blocks 1-2)</text>
<text x="533" y="283" class="sub">query 30 (blocks 3-5)</text>
<line x1="539" y1="301" x2="539" y2="308" class="arrow" marker-end="url(#head)"/>
<rect x="525" y="310" width="220" height="64" rx="6" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/>
<text x="533" y="327" class="name">Draws</text>
<text x="533" y="343" class="sub">k=2,5,10: 10 each</text>
<text x="533" y="357" class="sub">k=20: 1; total 434</text>
<line x1="539" y1="375" x2="539" y2="382" class="arrow" marker-end="url(#head)"/>
<rect x="525" y="384" width="220" height="64" rx="6" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/>
<text x="533" y="401" class="name">EEGNet batch</text>
<text x="533" y="417" class="sub">560 train, B=16</text>
<text x="533" y="431" class="sub">35 updates/epoch; val 150</text>
<line x1="539" y1="449" x2="539" y2="456" class="arrow" marker-end="url(#head)"/>
<rect x="525" y="458" width="220" height="64" rx="6" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/>
<text x="533" y="475" class="name">Test batch</text>
<text x="533" y="491" class="sub">30 query + 50 OFF</text>
<text x="533" y="505" class="sub">score per day; 5 days</text>
<line x1="539" y1="523" x2="539" y2="530" class="arrow" marker-end="url(#head)"/>
<rect x="525" y="532" width="220" height="64" rx="6" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/>
<text x="533" y="549" class="name">Window batch</text>
<text x="533" y="565" class="sub">(N_valid, 2800), B=256</text>
<text x="533" y="579" class="sub">ridge/KNN/MLP/GRU</text>
<rect x="15" y="615" width="176" height="88" rx="6" fill="#ffe9e9" stroke="#c62828" stroke-width="1.1"/>
<text x="23" y="632" class="name">R^2 (axis-averaged)</text>
<text x="23" y="648" class="sub">R^2 = (R^2_vx + R^2_vy)/2</text>
<text x="23" y="662" class="sub">per-day mean of R^2</text>
<rect x="199" y="615" width="176" height="88" rx="6" fill="#e7f0ff" stroke="#2f6fdb" stroke-width="1.1"/>
<text x="207" y="632" class="name">5-seed ensemble</text>
<text x="207" y="648" class="sub">v_ens = (1/5) sum_s v_s</text>
<text x="207" y="662" class="sub">score mean predictions</text>
<rect x="383" y="615" width="176" height="88" rx="6" fill="#fff4e0" stroke="#c77c02" stroke-width="1.1"/>
<text x="391" y="632" class="name">Tones</text>
<text x="391" y="648" class="sub">synthetic 3/20 Hz sine</text>
<text x="391" y="662" class="sub">clean training only</text>
<rect x="567" y="615" width="176" height="88" rx="6" fill="#f1e9ff" stroke="#6b46c1" stroke-width="1.1"/>
<text x="575" y="632" class="name">Why five test days?</text>
<text x="575" y="648" class="sub">test split is 5 days</text>
<text x="575" y="662" class="sub">all per-day figures</text>
<text x="15" y="722" class="note">Test days: 05-20: 1 ON (3 Hz), 05-30: 3 ON (20 Hz), 06-09: 3 ON (3 Hz), 06-13: 3 ON (3 Hz), 06-16: 4 ON (20 Hz)</text>
<text x="15" y="736" class="note">training: up to 200 epochs; early stop 20; batch 16; Muon on weight matrices + Adam on biases and BatchNorm vectors</text>
<text x="15" y="758" class="var">C 35   T 2000   N 40   V 2   B 16/256   F1 8   D 2   F2 16   K1 500   K2 62   P 2   Q 25   G 8   L 9</text>
</svg>